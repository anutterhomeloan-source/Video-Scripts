<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root{ --bluelt:#85B7EB; --gold:#FFD166; --teal:#1D9E75; }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:1080px;height:1920px;}
  body{
    font-family:'Segoe UI',Arial,sans-serif;
    background:linear-gradient(160deg,#042C53 0%,#0C447C 55%,#10243f 100%);
    color:#fff; display:flex; flex-direction:column;
    align-items:center; justify-content:center; padding:110px 90px; text-align:center;
  }
  .kicker{font-size:34px;letter-spacing:3px;text-transform:uppercase;color:var(--bluelt);font-weight:700;margin-bottom:22px;}
  .headline{font-size:64px;line-height:1.25;font-weight:800;margin-bottom:64px;}
  .chip{background:rgba(255,255,255,.07);border:2px solid rgba(133,183,235,.35);border-radius:24px;padding:38px 34px;margin-bottom:40px;}
  .chip .lbl{font-size:28px;color:#cfe0f2;font-weight:600;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:14px;}
  .chip .val{font-size:52px;font-weight:800;line-height:1.3;color:var(--teal);}
  .footnote{margin-top:30px;font-size:34px;text-align:center;color:var(--gold);font-weight:700;line-height:1.35;}
</style>
</head>
<body>
  <div class="kicker">Aug 4, 2026</div>
  <div class="headline">Judge Orders Florida's Property Tax Ballot Rewritten</div>
  <div class="chip">
    <div class="lbl">What It Actually Does</div>
    <div class="val">Homestead exemption:<br>$50K &rarr; $250K by 2028</div>
  </div>
  <div class="footnote">Source: CBS News Miami, Aug 4, 2026</div>
</body>
</html>
