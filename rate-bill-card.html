<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root{ --bluelt:#85B7EB; --gold:#FFD166; --teal:#1D9E75; }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:1080px;height:1920px;}
  body{
    font-family:'Segoe UI',Arial,sans-serif;
    background:linear-gradient(160deg,#042C53 0%,#0C447C 55%,#10243f 100%);
    color:#fff; display:flex; flex-direction:column;
    align-items:center; justify-content:center; padding:110px 90px;
  }
  .kicker{font-size:34px;letter-spacing:3px;text-transform:uppercase;color:var(--bluelt);font-weight:700;margin-bottom:22px;text-align:center;}
  .headline{font-size:60px;line-height:1.2;font-weight:800;text-align:center;margin-bottom:78px;}
  .scores{display:flex;align-items:center;justify-content:center;gap:34px;width:100%;margin-bottom:30px;}
  .chip{background:rgba(255,255,255,.07);border:2px solid rgba(133,183,235,.35);border-radius:24px;padding:38px 34px;text-align:center;flex:1;}
  .chip .lbl{font-size:28px;color:#cfe0f2;font-weight:600;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:14px;}
  .chip .val{font-size:76px;font-weight:800;line-height:1;color:var(--teal);}
  .footnote{margin-top:64px;font-size:36px;text-align:center;color:var(--gold);font-weight:700;line-height:1.35;}
  .sub{margin-top:34px;font-size:34px;text-align:center;color:#cfe0f2;font-weight:600;}
</style>
</head>
<body>
  <div class="kicker">Today's Rate</div>
  <div class="headline">30-Year Fixed Mortgage</div>
  <div class="scores">
    <div class="chip"><div class="lbl">30-Year Fixed</div><div class="val">6.632%</div></div>
    <div class="chip"><div class="lbl">15-Year Fixed</div><div class="val">5.780%</div></div>
  </div>
  <div class="sub">Congress just introduced a bill to expand<br>lower-rate loans for first-time buyers</div>
  <div class="footnote">Source: Fortune, Aug 17, 2026</div>
</body>
</html>
