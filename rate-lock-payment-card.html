<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root{ --bluelt:#85B7EB; --gold:#FFD166; --red:#E24B4A; }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:1080px;height:1920px;}
  body{
    font-family:'Segoe UI',Arial,sans-serif;
    background:linear-gradient(160deg,#042C53 0%,#0C447C 55%,#10243f 100%);
    color:#fff; display:flex; flex-direction:column;
    align-items:center; justify-content:center; padding:110px 90px;
  }
  .kicker{font-size:34px;letter-spacing:3px;text-transform:uppercase;color:var(--bluelt);font-weight:700;margin-bottom:30px;text-align:center;}
  .card{width:100%;background:#fff;color:#10243f;border-radius:30px;padding:64px 58px;box-shadow:0 30px 70px rgba(0,0,0,.45);}
  .badge{display:inline-block;background:#0C447C;color:#fff;font-size:28px;font-weight:800;letter-spacing:2px;text-transform:uppercase;padding:12px 26px;border-radius:10px;margin-bottom:40px;}
  .row{display:flex;justify-content:space-between;align-items:baseline;padding:28px 0;border-bottom:2px solid #e3e8ef;}
  .rate{font-size:80px;font-weight:900;}
  .pay{font-size:64px;font-weight:800;color:#33475e;}
  .pay small{font-size:34px;color:#5a6b80;}
  .row.hi .rate{color:var(--red);}
  .diff{margin-top:40px;text-align:center;}
  .diff .a{font-size:110px;font-weight:900;color:var(--red);line-height:1;}
  .diff .b{font-size:40px;font-weight:700;color:#33475e;margin-top:14px;}
  .src{margin-top:44px;font-size:28px;color:#5a6b80;font-weight:600;border-top:2px solid #e3e8ef;padding-top:24px;}
  .tie{margin-top:80px;font-size:56px;line-height:1.18;font-weight:800;text-align:center;}
  .tie .hl{color:var(--gold);}
</style>
</head>
<body>
  <div class="kicker">What a rate lock protects</div>
  <div class="card">
    <div class="badge">$400,000 loan</div>
    <div class="row"><div class="rate">7.0%</div><div class="pay">$2,661<small>/mo</small></div></div>
    <div class="row hi"><div class="rate">7.5%</div><div class="pay">$2,797<small>/mo</small></div></div>
    <div class="diff"><div class="a">+$136/mo</div><div class="b">~$49,000 over 30 years</div></div>
    <div class="src">Principal &amp; interest only &middot; 30-year fixed &middot; illustrative example</div>
  </div>
  <div class="tie">When are we <span class="hl">locking?</span></div>
</body>
</html>
