<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root{ --bluelt:#85B7EB; --gold:#FFD166; --teal:#1D9E75; --navy:#042C53; --navy2:#0C447C; }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:1080px;height:1920px;}
  body{
    font-family:'Segoe UI',Arial,sans-serif;
    background:linear-gradient(160deg,#0C447C 0%,#042C53 60%,#0a1c33 100%);
    color:#fff; display:flex; flex-direction:column; align-items:center;
  }
  .header{ text-align:center; padding:64px 60px 0; }
  .kicker{font-size:26px;letter-spacing:4px;text-transform:uppercase;color:var(--gold);font-weight:800;}
  .headline{font-size:48px;font-weight:800;margin-top:8px;line-height:1.15;}
  .sub{font-size:26px;color:#cfe0f2;font-weight:600;margin-top:8px;}

  .board{ position:relative; width:1080px; height:1450px; margin-top:34px; }
  svg.path-line{ position:absolute; top:0; left:0; }
  .node{ position:absolute; width:150px; height:150px; border-radius:50%; display:flex; flex-direction:column; align-items:center; justify-content:center; background:rgba(255,255,255,.10); border:4px solid rgba(255,255,255,.32); text-align:center; }
  .node .icon{ font-size:50px; line-height:1; margin-bottom:2px; }
  .node .lbl{ font-size:18px; font-weight:800; line-height:1.15; padding:0 8px; }
  .node .n{ position:absolute; top:-12px; left:-12px; width:38px; height:38px; border-radius:50%; background:var(--navy); border:3px solid rgba(255,255,255,.5); display:flex; align-items:center; justify-content:center; font-size:17px; font-weight:900; }

  .node.current{ background:rgba(255,209,102,.18); border:5px solid var(--gold); box-shadow:0 0 0 12px rgba(255,209,102,.14), 0 0 50px rgba(255,209,102,.45); }

  .here{ position:absolute; top:-42px; left:50%; transform:translateX(-50%); background:#fff; color:var(--navy); font-size:15px; font-weight:800; padding:5px 12px; border-radius:999px; white-space:nowrap; box-shadow:0 4px 10px rgba(0,0,0,.25); }

  .token{ position:absolute; width:58px; height:58px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #fff3d1, var(--gold) 60%, #c98f2a); border:3px solid #fff; display:flex; align-items:center; justify-content:center; font-size:28px; box-shadow:0 5px 12px rgba(0,0,0,.4); }

  .footer{ margin-top:26px; font-size:22px; font-weight:700; color:var(--bluelt); text-align:center; padding-bottom:20px; }
</style>
</head>
<body>
  <div class="header">
    <div class="kicker">Your Next Move</div>
    <div class="headline">Before You're Under Contract</div>
    <div class="sub">Step 4 of 9 &mdash; Realtor</div>
  </div>

  <div class="board">
    <svg class="path-line" width="1080" height="1450">
      <polyline points="245,165 835,315 245,465 835,615 245,765 835,915 245,1065 835,1215 540,1365"
        fill="none" stroke="#FFD166" stroke-width="9" stroke-dasharray="4 24" stroke-linecap="round" opacity="0.6"/>
    </svg>

    <div class="node" style="left:170px; top:90px;">
      <div class="n">1</div>
      <div class="icon">&#128222;</div>
      <div class="lbl">Loan Officer</div>
    </div>
    <div class="node" style="left:760px; top:240px;">
      <div class="n">2</div>
      <div class="icon">&#128176;</div>
      <div class="lbl">Set A Budget</div>
    </div>
    <div class="node" style="left:170px; top:390px;">
      <div class="n">3</div>
      <div class="icon">&#128196;</div>
      <div class="lbl">Pre-Approval</div>
    </div>
    <div class="node current" style="left:760px; top:540px;">
      <div class="here">YOU ARE HERE</div>
      <div class="n">4</div>
      <div class="icon">&#127969;</div>
      <div class="lbl">Realtor</div>
      <div class="token" style="right:-14px; bottom:-14px;">&#127968;</div>
    </div>
    <div class="node" style="left:170px; top:690px;">
      <div class="n">5</div>
      <div class="icon">&#128269;</div>
      <div class="lbl">House Hunting</div>
    </div>
    <div class="node" style="left:760px; top:840px;">
      <div class="n">6</div>
      <div class="icon">&#9999;&#65039;</div>
      <div class="lbl">Make An Offer</div>
    </div>
    <div class="node" style="left:170px; top:990px;">
      <div class="n">7</div>
      <div class="icon">&#128737;&#65039;</div>
      <div class="lbl">The Ceiling</div>
    </div>
    <div class="node" style="left:760px; top:1140px;">
      <div class="n">8</div>
      <div class="icon">&#129309;</div>
      <div class="lbl">Negotiate</div>
    </div>
    <div class="node" style="left:465px; top:1290px;">
      <div class="n">9</div>
      <div class="icon">&#127881;</div>
      <div class="lbl">Under Contract!</div>
    </div>
  </div>

  <div class="footer">Save this &mdash; new step every video &#128190;</div>
</body>
</html>
