<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root{ --bluelt:#85B7EB; --gold:#FFD166; --red:#E24B4A; }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:1080px;height:1920px;}
  body{
    font-family:'Segoe UI',Arial,sans-serif;
    background:linear-gradient(160deg,#042C53 0%,#0C447C 55%,#10243f 100%);
    color:#fff; display:flex; flex-direction:column;
    align-items:center; justify-content:center; padding:110px 90px;
  }
  .kicker{font-size:34px;letter-spacing:3px;text-transform:uppercase;color:var(--bluelt);font-weight:700;margin-bottom:30px;text-align:center;}
  .card{width:100%;background:#fff;color:#10243f;border-radius:30px;padding:64px 58px;box-shadow:0 30px 70px rgba(0,0,0,.45);}
  .badge{display:inline-block;background:#0C447C;color:#fff;font-size:28px;font-weight:800;letter-spacing:2px;text-transform:uppercase;padding:12px 26px;border-radius:10px;margin-bottom:40px;}
  .cols{display:flex;gap:30px;}
  .col{flex:1;border-radius:22px;padding:40px 28px;text-align:center;background:#eef3f9;}
  .col.hi{background:#fdecec;}
  .col .r{font-size:44px;font-weight:800;color:#5a6b80;}
  .col .amt{font-size:76px;font-weight:900;color:#0C447C;margin-top:14px;}
  .col.hi .amt{color:var(--red);}
  .col .l{font-size:30px;font-weight:600;color:#5a6b80;margin-top:8px;}
  .same{margin-top:40px;text-align:center;font-size:40px;font-weight:700;color:#33475e;}
  .src{margin-top:40px;font-size:28px;color:#5a6b80;font-weight:600;border-top:2px solid #e3e8ef;padding-top:24px;}
  .tie{margin-top:80px;font-size:60px;line-height:1.18;font-weight:800;text-align:center;}
  .tie .hl{color:var(--gold);}
</style>
</head>
<body>
  <div class="kicker">Pre-approved this summer?</div>
  <div class="card">
    <div class="badge">Same $2,661/mo payment</div>
    <div class="cols">
      <div class="col"><div class="r">at 7.0%</div><div class="amt">$400K</div><div class="l">loan</div></div>
      <div class="col hi"><div class="r">at 7.5%</div><div class="amt">~$380K</div><div class="l">loan</div></div>
    </div>
    <div class="same">Re-run your numbers before your next offer.</div>
    <div class="src">Principal &amp; interest only &middot; 30-year fixed &middot; illustrative example</div>
  </div>
  <div class="tie">Same payment.<br><span class="hl">$20,000 less house.</span></div>
</body>
</html>
