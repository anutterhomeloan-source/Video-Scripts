<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root{ --bluelt:#85B7EB; --gold:#FFD166; --red:#E24B4A; --teal:#1D9E75; }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:1080px;height:1920px;}
  body{
    font-family:'Segoe UI',Arial,sans-serif;
    background:linear-gradient(160deg,#042C53 0%,#0C447C 55%,#10243f 100%);
    color:#fff; display:flex; flex-direction:column;
    align-items:center; justify-content:center; padding:110px 90px;
  }
  .kicker{font-size:34px;letter-spacing:3px;text-transform:uppercase;color:var(--bluelt);font-weight:700;margin-bottom:22px;text-align:center;}
  .headline{font-size:64px;line-height:1.2;font-weight:800;text-align:center;margin-bottom:78px;}
  .scores{display:flex;align-items:center;justify-content:center;gap:34px;width:100%;margin-bottom:30px;}
  .chip{background:rgba(255,255,255,.07);border:2px solid rgba(133,183,235,.35);border-radius:24px;padding:38px 40px;text-align:center;flex:1;}
  .chip .lbl{font-size:30px;color:#cfe0f2;font-weight:600;text-transform:uppercase;letter-spacing:2px;margin-bottom:14px;}
  .chip .val{font-size:88px;font-weight:800;line-height:1;}
  .before .val{color:var(--red);}
  .after .val{color:var(--teal);}
  .arrow{font-size:70px;color:var(--gold);font-weight:900;flex:none;}
  .footnote{margin-top:64px;font-size:38px;text-align:center;color:var(--gold);font-weight:700;line-height:1.35;}
</style>
</head>
<body>
  <div class="kicker">Is this 2008 again?</div>
  <div class="headline">National home prices, 4 years after each boom ended</div>
  <div class="scores">
    <div class="chip before"><div class="lbl">2006&ndash;2010</div><div class="val">&minus;17.3%</div></div>
    <div class="arrow">&#8594;</div>
    <div class="chip after"><div class="lbl">2022&ndash;2026</div><div class="val">+4.3%</div></div>
  </div>
  <div class="footnote">Source: ResiClub / Lance Lambert, 8.1.26</div>
</body>
</html>
