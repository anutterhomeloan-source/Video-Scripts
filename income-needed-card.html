<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root{ --bluelt:#85B7EB; --gold:#FFD166; --red:#E24B4A; --teal:#1D9E75; }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:1080px;height:1920px;}
  body{
    font-family:'Segoe UI',Arial,sans-serif;
    background:linear-gradient(160deg,#042C53 0%,#0C447C 55%,#10243f 100%);
    color:#fff; display:flex; flex-direction:column;
    align-items:center; justify-content:center; padding:110px 90px;
  }
  .kicker{font-size:34px;letter-spacing:3px;text-transform:uppercase;color:var(--bluelt);font-weight:700;margin-bottom:22px;text-align:center;}
  .headline{font-size:60px;line-height:1.2;font-weight:800;text-align:center;margin-bottom:78px;}
  .scores{display:flex;align-items:center;justify-content:center;gap:34px;width:100%;margin-bottom:30px;}
  .chip{background:rgba(255,255,255,.07);border:2px solid rgba(133,183,235,.35);border-radius:24px;padding:38px 34px;text-align:center;flex:1;}
  .chip .lbl{font-size:28px;color:#cfe0f2;font-weight:600;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:14px;}
  .chip .val{font-size:76px;font-weight:800;line-height:1;}
  .national .val{color:var(--red);}
  .atlanta .val{color:var(--teal);}
  .arrow{font-size:70px;color:var(--gold);font-weight:900;flex:none;}
  .footnote{margin-top:64px;font-size:36px;text-align:center;color:var(--gold);font-weight:700;line-height:1.35;}
</style>
</head>
<body>
  <div class="kicker">New Data</div>
  <div class="headline">Income needed to afford the average home</div>
  <div class="scores">
    <div class="chip national"><div class="lbl">National</div><div class="val">$116,780</div></div>
    <div class="arrow">&#8594;</div>
    <div class="chip atlanta"><div class="lbl">Metro Atlanta</div><div class="val">$107,145</div></div>
  </div>
  <div class="footnote">Source: CBS News / Redfin, May 2026 &middot; WSB-TV Atlanta</div>
</body>
</html>
