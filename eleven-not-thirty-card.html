<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root{ --bluelt:#85B7EB; --gold:#FFD166; --red:#E24B4A; }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:1080px;height:1920px;}
  body{
    font-family:'Segoe UI',Arial,sans-serif;
    background:linear-gradient(160deg,#042C53 0%,#0C447C 55%,#10243f 100%);
    color:#fff; display:flex; flex-direction:column;
    align-items:center; justify-content:center; padding:110px 90px;
  }
  .kicker{font-size:34px;letter-spacing:3px;text-transform:uppercase;color:var(--bluelt);font-weight:700;margin-bottom:30px;text-align:center;}
  .card{width:100%;background:#fff;color:#10243f;border-radius:30px;padding:64px 58px;box-shadow:0 30px 70px rgba(0,0,0,.45);}
  .badge{display:inline-block;background:#0C447C;color:#fff;font-size:28px;font-weight:800;letter-spacing:2px;text-transform:uppercase;padding:12px 26px;border-radius:10px;margin-bottom:34px;}
  .big{font-size:150px;line-height:1;font-weight:900;color:#0C447C;}
  .big .not{color:#a0adbd;text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:10px;}
  .sub{font-size:44px;font-weight:700;margin-top:24px;line-height:1.2;}
  .bar{position:relative;height:40px;background:#e3e8ef;border-radius:20px;margin-top:60px;}
  .fill{position:absolute;left:0;top:0;bottom:0;width:36.7%;background:#0C447C;border-radius:20px;}
  .ticks{display:flex;justify-content:space-between;font-size:28px;color:#5a6b80;font-weight:700;margin-top:14px;}
  .src{margin-top:44px;font-size:30px;color:#5a6b80;font-weight:600;border-top:2px solid #e3e8ef;padding-top:26px;}
  .tie{margin-top:80px;font-size:56px;line-height:1.18;font-weight:800;text-align:center;}
  .tie .hl{color:var(--gold);}
</style>
</head>
<body>
  <div class="kicker">How long people actually stay</div>
  <div class="card">
    <div class="badge">Typical seller</div>
    <div class="big">11 yrs <span class="not">30</span></div>
    <div class="sub">A record high, and still nowhere near 30.</div>
    <div class="bar"><div class="fill"></div></div>
    <div class="ticks" style="position:relative;"><span>0</span><span style="position:absolute;left:36.7%;transform:translateX(-50%);">11 yrs</span><span>30 yrs</span></div>
    <div class="src">Source: NAR 2025 Profile of Home Buyers and Sellers</div>
  </div>
  <div class="tie">Stop judging your mortgage<br>by <span class="hl">year 30.</span></div>
</body>
</html>
